name = "mizook"
main = "src/index.ts"
compatibility_date = "2026-05-08"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "mizook-screenshots"

[[durable_objects.bindings]]
class_name = "MizookAgent"
name = "MIZOOK_AGENT"

[[durable_objects.bindings]]
class_name = "ChatStateDO"
name = "CHAT_STATE"

[[durable_objects.bindings]]
class_name = "DiscordGatewayDO"
name = "DISCORD_GATEWAY"

[[migrations]]
new_sqlite_classes = ["MizookAgent"]
tag = "v1"

[[migrations]]
new_sqlite_classes = ["ChatStateDO"]
tag = "v2"

[[migrations]]
new_sqlite_classes = ["DiscordGatewayDO"]
tag = "v3"

[observability.logs]
enabled = true
invocation_logs = true

[vars]
OPENCODE_GO_MODEL = "deepseek-v4-flash"
TIMEZONE = "Asia/Jakarta"
# EXA_API_KEY = "your-exa-api-key"
