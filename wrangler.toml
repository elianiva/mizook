name = "mizook"
main = "src/index.ts"
compatibility_date = "2026-05-08"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "MIZOOK_R2"
bucket_name = "mizook-r2"

[[durable_objects.bindings]]
class_name = "MizookAgent"
name = "MIZOOK_AGENT"

[[durable_objects.bindings]]
class_name = "ChatStateDO"
name = "CHAT_STATE"

[[migrations]]
tag = "v1"

[[migrations]]
new_sqlite_classes = ["ChatStateDO"]
tag = "v2"

[[migrations]]
tag = "v3"

[[migrations]]
tag = "v4"

[observability.logs]
enabled = true
invocation_logs = true

[vars]
OPENCODE_GO_MODEL = "mimo-v2.5-pro"
TIMEZONE = "Asia/Jakarta"
# EXA_API_KEY = "your-exa-api-key"
